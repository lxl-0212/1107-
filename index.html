<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini AI Campus Assistant V2</title><style>body{margin:0;background:#0b1220;color:#e8f0ff;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:25px}h1{font-size:1.7rem}p,small{color:#9ab0ca}.chat{background:#131f32;border:1px solid #2b425c;border-radius:16px;padding:18px;min-height:340px;max-height:60vh;overflow:auto}.msg{margin:14px 0;padding:13px;border-radius:12px;white-space:pre-wrap;line-height:1.65}.user{background:#1b4262;margin-left:12%}.assistant{background:#1b293e;margin-right:8%}.sources{font-size:.83rem;color:#b4c7df;margin:8px 0 0 12px}.source{border-left:2px solid #4c9ecb;padding:6px 10px;margin:6px 0}.controls{display:flex;gap:10px;margin-top:12px}input{flex:1;padding:15px;border:1px solid #49617e;border-radius:10px;background:#17263a;color:white;font-size:1rem}button{border:0;border-radius:10px;background:#3a9ddd;color:#061321;font-weight:700;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}details{margin-top:12px;color:#a4c5e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem}a{color:#8cd1ff}</style></head><body><main class="wrap"><h1>🎓 Mini AI Campus Assistant V2</h1><p>多工具查證 · 多輪追問 · 官方來源核對 · 安全轉介</p><section class="chat" id="chat" aria-live="polite"><div class="msg assistant">您好！可以詢問請假規定、分機、行事曆或校務辦理流程。資料為公開資料快照，重要事項請以最新校方公告為準。</div></section><form class="controls" id="form"><input id="question" placeholder="例如：我昨天生病沒去學校，今天怎麼補請假？" maxlength="1500" required aria-label="提問"><button id="send">送出</button><button type="button" id="reset">新對話</button></form><small>不輸入學號、身分證、密碼、成績或其他個人敏感資料。服務不會代辦校務操作。</small></main><script>
let sid=null;const chat=document.getElementById('chat'),form=document.getElementById('form'),q=document.getElementById('question'),send=document.getElementById('send');
function block(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener('submit',async e=>{e.preventDefault();const value=q.value.trim();if(!value)return;block(value,'user');q.value='';send.disabled=true;const out=block('查詢中…','assistant');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value,session_id:sid})});const d=await r.json();if(!r.ok)throw new Error(d.error||'查詢失敗');sid=d.session_id;out.textContent=d.reply;const ev=d.evidence||[];if(ev.length){const box=document.createElement('div');box.className='sources';const title=document.createElement('strong');title.textContent='查詢證據（請核對版本）';box.append(title);for(const item of ev.slice(0,6)){const row=document.createElement('div');row.className='source';row.textContent=`${item.title}｜${item.source_id}｜${item.version||'版本未標示'}：${item.excerpt.slice(0,220)}`;if(item.url&&item.url_type==='document'){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' 官方文件';row.append(a)}box.append(row)}chat.append(box)}const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=`Agent Trace｜${d.status}｜${d.request_id}`;details.append(summary);const pre=document.createElement('pre');pre.textContent=JSON.stringify(d.trace,null,2);details.append(pre);chat.append(details)}catch(err){out.textContent='查詢失敗：'+err.message}finally{send.disabled=false;q.focus();chat.scrollTop=chat.scrollHeight}});
document.getElementById('reset').onclick=async()=>{if(sid)await fetch('/session/'+encodeURIComponent(sid),{method:'DELETE'}).catch(()=>{});sid=null;chat.replaceChildren();block('已開始新對話。','assistant')};
</script></body></html>
